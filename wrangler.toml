# BacZone على Cloudflare Workers عبر OpenNext (@opennextjs/cloudflare)
# الخطّة المطلوبة: Workers Paid — الخطّة المجانية تحدّ وقت المعالجة بـ 10ms لكلّ طلب.
# الأسرار لا تُكتب هنا أبداً: `npx wrangler secret put NAME` أو لوحة Cloudflare.
name = "baczonedz"
main = ".open-next/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# نطاق التجربة. baczone.app نفسه يبقى على Vercel حتى التحويل النهائي.
routes = [
  { pattern = "cf.baczone.app", custom_domain = true },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# مرجع ذاتي يستعمله OpenNext لإعادة توليد صفحات ISR — يجب أن يطابق `name` أعلاه.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "baczonedz"

# incremental cache (صفحات ISR) — أُنشئ على الحساب بالأمر:
#   npx wrangler r2 bucket create baczone-next-cache
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "baczone-next-cache"

# tag cache لـ revalidatePath — أُنشئ على الحساب بالأمر:
#   npx wrangler d1 create baczone-next-tag-cache
[[d1_databases]]
binding = "NEXT_TAG_CACHE_D1"
database_name = "baczone-next-tag-cache"
database_id = "443a0776-0ed1-4a1e-b320-35f9635c4f62"

# طابور إعادة التوليد في الخلفية (ISR الزمني)
[[durable_objects.bindings]]
name = "NEXT_CACHE_DO_QUEUE"
class_name = "DOQueueHandler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DOQueueHandler"]

[observability]
enabled = true
