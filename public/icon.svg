<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#6d4ce6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- خلفية متدرّجة -->
  <rect width="192" height="192" rx="44" fill="url(#bg)"/>
  <rect width="192" height="96" rx="44" fill="url(#shine)"/>

  <!-- قبّعة التخرّج -->
  <g>
    <!-- ظل القاعدة -->
    <ellipse cx="96" cy="118" rx="38" ry="24" fill="#1e1b4b" opacity="0.18"/>
    <!-- قاعدة القبّعة (الرأس) -->
    <path d="M62 110 a34 24 0 0 0 68 0 v6 a34 24 0 0 1 -68 0 z" fill="#ffffff" opacity="0.92"/>
    <!-- لوح القبّعة العلوي (معيّن) -->
    <path d="M96 50 L160 80 L96 110 L32 80 Z" fill="#ffffff"/>
    <path d="M96 50 L160 80 L96 92 L32 80 Z" fill="#ffffff" opacity="0.65"/>
    <!-- الشُرّابة -->
    <circle cx="142" cy="84" r="7" fill="#34d399"/>
    <path d="M96 80 L142 84" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- صفحة كتاب أسفل القبّعة -->
  <path d="M52 138 q44 -14 88 0 v8 q-44 -12 -88 0 z" fill="#ffffff" opacity="0.85"/>
</svg>
